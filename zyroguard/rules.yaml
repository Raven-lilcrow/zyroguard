# Pieces of a sender's display name or username that mean impersonation when the
# sender is not actually an admin of the group.
# Matched as whole words (CamelCase split, plural s allowed), so "BadmintonFan" or
# "Lakers Supporter" are fine while "JohnAdmin" or "crypto_support" are not.
impersonation:
  - admin
  - administrator
  - support
  - moderator
  - official
  - helpdesk
  - customer care
  - verification

# Names protected in every group: a non-admin whose name imitates one of these with lookalike
# letters (ZyroGuarcl, Zyr0Guard) is removed at join and on any message. Each group adds its own
# with the protected_names setting (e.g. AcmeAI).
protected_names:
  - ZyroGuard

# Display names and bios that block a join outright.
# Only links: ordinary words like "crypto" or "support" in a name are not a reason to kick.
join_name_patterns:
  - 't\.me/'
  - 'https?://'

bio_patterns:
  - 't\.me/'
  - 'https?://'
  - '\b(usdt|investment|forex|signals?|crypto\s+expert|account\s+manager)\b'

# Domains that never count as links (applies to every group unless overridden).
global_allow_domains:
  - github.com
  - wikipedia.org
  - youtube.com
  - youtu.be

# Safety check triggers. A text message matching one of these is sent to the AI
# safety check (explicit, violent, harassing or hateful content). Images always
# go to the safety check when it is on, so no trigger is needed for them.
# Admins can widen this with /rule add, which acts immediately without the AI.
safety_triggers:
  - '\b(kill|hang|shoot)\s+(your|ur)\s*self\b|\bkys\b'
  - '\b(rape|raping|rapist)\b'
  - '\b(nigg\w*|fagg?\w*|tranny|retard\w*|kike|spic|chink|wetback)\b'
  - '\b(whore|slut|cunt)\b'
  - '\b(nude|nudes|porn\w*|onlyfans|sex\s*(chat|cam|video)|xxx+|nsfw|hentai|horny)\b'
  - '🔞|\b18\s*\+'
  - '\b(leaked|homemade|uncensored|backstage|rough)\b.{0,60}\b(video|vids?|pics?|photos?|content|tape|here|first\s*time)\b'
  - '\b(hot|sexy)\s+(girls?|videos?|pics|content|chat)\b'
  - '\b(i will|gonna|going to)\s+(find|hurt|kill|beat|stab)\s+(you|u|him|her|them)\b'
